services:
  db:
    image: postgres:16-alpine
    container_name: team-ops-mcp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamops_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-teamops}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamops} -d ${POSTGRES_DB:-teamops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-ops-mcp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      # Override localhost -> Docker service hostname 'db' inside container network
      DATABASE_URL: postgresql://${POSTGRES_USER:-teamops}:${POSTGRES_PASSWORD:-teamops_dev_password}@db:5432/${POSTGRES_DB:-teamops}
      ALLOWED_HOSTS: '["127.0.0.1:*","localhost:*","[::1]:*","app:*"]'
      ALLOWED_ORIGINS: '["http://127.0.0.1:*","http://localhost:*","http://[::1]:*"]'
    ports:
      - "8000:8000"

volumes:
  pgdata: