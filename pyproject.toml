[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team-ops-mcp"
version = "0.1.0"
description = "Authenticated, audited MCP server for team engineering operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"