name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamops
          POSTGRES_PASSWORD: teamops_ci_password
          POSTGRES_DB: teamops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamops -d teamops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint & format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest with coverage
        env:
          DATABASE_URL: postgresql://teamops:teamops_ci_password@127.0.0.1:5432/teamops
          TEST_DATABASE_URL: postgresql://teamops:teamops_ci_password@127.0.0.1:5432/teamops_test
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Verify Docker image builds
        run: docker build -t team-ops-mcp:ci .